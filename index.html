function renderMoney(){let personal=expenseTab==='private';let list=(personal?privateData.expenses:shared.expenses);let total=(payer,unit)=>list.filter(x=>!payer||x.payer===payer).reduce((a,x)=>a+convert(x.amount,x.currency,unit),0);const currency='CNY';return `<div class="sectiontitle row"><b>여행 가계부</b>${btn('＋ 지출 기록','new:expense','smallbtn')}</div><div class="seg"><button data-expense-tab="shared" class="${!personal?'active':''}">공동 가계부</button><button data-expense-tab="private" class="${personal?'active':''}">${viewer} 개인 가계부 🔒</button></div><div class="small" style="margin:12px 2px">표시 합계는 참고 환율 ¥1 = ₩${shared.rate}로 환산 · 각 내역의 실제 결제 통화는 유지</div>${personal?`<div class="card"><div class="stat"><small>내 개인 지출 합계 (CNY 환산)</small><b class="money">¥${won(total(null,currency))}</b></div></div>`:`<div class="two"><div class="stat"><small>유림 공동 결제 합계</small><b class="money">¥${won(total('유림',currency))}</b></div><div class="stat"><small>민지 공동 결제 합계</small><b class="money">¥${won(total('민지',currency))}</b></div></div><div class="card"><div class="row"><span>공동 지출 총합</span><strong class="money">¥${won(total(null,currency))}</strong></div></div>`}<div class="row sectiontitle"><b>지출 내역</b><span class="small">${list.length}건</span></div>${list.length?list.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="card"><div class="row"><div><b>${esc(x.title)}</b><div class="small">${esc(x.date)} · ${esc(x.payer)} · ${esc(x.method||'결제수단 미기입')}</div><div class="small">${esc(x.note||'')}${x.reservation?' · 예약금/잔금 연관':''}</div></div><b class="money">${x.currency==='CNY'?'¥':'₩'}${won(number(x.amount))}</b></div><div style="margin-top:9px">${actions('',x.id,'expense')}</div></div>`).join(''):`<div class="card empty">아직 지출 기록이 없어. 기록을 추가해봐!</div>`}<div class="card"><div class="row"><b>참고 환율 설정</b><span class="small">1 CNY = ${shared.rate} KRW</span></div>${btn('환율 변경','rate','outline')}</div><div class="notice">결제 비율, 정산 차액, 누가 더 부담했는지는 표시하지 않아. 개인 가계부는 공동 연결 시 본인만 열람할 수 있도록 보안 규칙을 적용해.</div>`}
function convert(amount,cur,target){let n=number(amount);return cur===target?n:(cur==='KRW'?n/number(shared.rate||205):n*number(shared.rate||205))}
function renderMore(){return `<div class="sectiontitle">여행 관리</div><div class="card"><div class="row"><h3>예약금·잔금 관리</h3>${btn('＋ 예약 추가','new:reservation','smallbtn')}</div>${shared.reservations.length?shared.reservations.map(r=>`<div class="listitem"><div class="row"><b>${esc(r.title)}</b><span class="pill">${esc(r.status)}</span></div><div class="small">예약금 ${r.currency==='CNY'?'¥':'₩'}${won(number(r.deposit))} · ${esc(r.payer)} 결제</div><div class="small">총액 ${won(number(r.total))} · ${r.refund==='yes'?'예약금 환불 완료':r.policy==='deduct'?'예약금 차감':'예약금 별도 처리'} · 잔금 예정 ${won(Math.max(0,number(r.total)-(r.policy==='deduct'?number(r.deposit):0)))}</div><div class="actions" style="margin-top:9px">${btn('수정','edit:reservation:'+r.id,'smallbtn ghost')}${btn('삭제','delete:reservation:'+r.id,'smallbtn outline')}</div></div>`).join(''):`<p class="small">예약금과 잔금을 구분하고, 환불 여부와 결제자를 기록할 수 있어.</p>`}</div><div class="card"><div class="row"><h3>공동 여행 체크리스트</h3>${btn('＋ 추가','new:check','smallbtn')}</div>${shared.checklist.map(x=>`<div class="listitem row"><label class="checkboxline"><input type="checkbox" data-check="${x.id}" ${x.done?'checked':''}><span style="${x.done?'text-decoration:line-through;color:#92a39b':''}">${esc(x.text)}</span></label><button class="btn ghost smallbtn" data-act="delete:check:${x.id}">삭제</button></div>`).join('')}</div><div class="card"><div class="row"><h3>일정 변경 기록</h3>${btn('전체 보기','history','smallbtn outline')}</div>${shared.history.slice(0,4).map(h=>`<div class="listitem"><b>${esc(h.action)}</b><div class="small">${esc(h.who)} · ${new Date(h.when).toLocaleString('ko-KR')}</div></div>`).join('')||'<p class="small">수정 내역이 아직 없어.</p>'}</div><div class="card"><h3>계정 및 공유 설정</h3>${isCloud?`<p class="small">${esc(authUser?.email||'')} · ${viewer} 계정</p>${btn('로그아웃','logout','outline')}`:`<p class="small">현재는 이 브라우저에만 저장되는 로컬 데모 모드야. Firebase 설정 후 유림과 민지가 각자 로그인하면 일정·공동 가계부가 동기화돼.</p><div class="field"><label>로컬 시연자</label><select id="viewerSelect"><option ${viewer==='유림'?'selected':''}>유림</option><option ${viewer==='민지'?'selected':''}>민지</option></select></div>${firebaseConfig?btn('공동 계정 로그인','login'):'<div class="notice">실제 공동 사용은 firebase-config.js와 Firestore 보안 규칙 설정이 필요해.</div>'}`}</div><div class="card"><h3>백업·복원</h3><p class="small">현재 보이는 공유 일정 및 내 개인 가계부를 JSON으로 백업할 수 있어.</p><div class="actions">${btn('데이터 백업','backup','outline')}${btn('백업 불러오기','import','ghost')}</div><input type="file" id="importFile" accept="application/json" class="hidden"></div><div class="footer-note">Yurim & Minji · Shanghai 2026 · no pressure, just memories</div>`}
function field(k,label,value='',type='text'){return `<div class="field"><label for="f_${k}">${label}</label>${type==='textarea'?`<textarea id="f_${k}" name="${k}">${esc(value)}</textarea>`:type.startsWith('options:')?`<select id="f_${k}" name="${k}">${type.slice(8).split('|').map(o=>`<option value="${esc(o)}" ${o===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${k}" name="${k}" type="${type}" value="${esc(value)}">`}</div>`}
function modal(title,html,saveLabel='저장',type=''){formOpen=true;$('#overlay').innerHTML=`<div class="modalback"><div class="modal"><div class="row"><h2>${esc(title)}</h2><button class="btn ghost smallbtn" id="closeModal">닫기 ×</button></div><form id="form" data-form="${type}">${html}<div class="actions" style="margin-top:16px"><button type="submit" class="btn">${saveLabel}</button><button type="button" class="btn ghost" id="cancelModal">취소</button></div></form></div></div>`}
function closeModal(){formOpen=false;$('#overlay').innerHTML=''}
function editEvent(id){let obj=id?shared.schedules[version].find(x=>x.id===id):{id:uid(),day,time:'',title:'',place:'',note:'',move:'',duration:'',fixed:false};modal(id?'일정 수정':'일정 추가',field('day','날짜 (11월)',''+obj.day,'options:28|29|30')+field('time','시작 시간',obj.time,'time')+field('title','일정 이름',obj.title)+`<div class="field"><label>연결된 장소</label><select name="place"><option value="">연결 안 함</option>${shared.places.map(p=>`<option value="${esc(p.id)}" ${p.id===obj.place?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`+field('move','이동수단·이동시간·여유시간',obj.move)+field('duration','소요시간 메모',obj.duration)+field('note','일정 메모',obj.note,'textarea')+field('fixed','예약 확정시간 (true/false)',String(obj.fixed),'options:false|true'),'저장','event:'+obj.id)}
function editPlace(id){let o=id?place(id):{id:uid(),name:'',category:'식당',description:'',note:'',order:'',search:'',map:''};modal(id?'장소 정보 수정':'장소 추가',field('name','장소명',o.name)+field('category','분류',o.category,'options:식당|카페|쇼핑|관광|바|체험|숙소|예약|기타')+field('description','어떤 곳인지 간단한 설명',o.description)+field('order','먹어보고 싶은 메뉴 · 자유 메모',o.order,'textarea')+field('note','방문 팁·메모',o.note,'textarea')+field('search','고덕지도 검색어 (중국어 가능)',o.search)+field('map','고덕지도 링크',o.map,'url'),'저장','place:'+o.id)}
function editExpense(id){let arr=expenseTab==='private'?privateData.expenses:shared.expenses;let o=id?arr.find(x=>x.id===id):{id:uid(),title:'',payer:viewer,amount:'',currency:'CNY',date:'2026-11-28',method:'',note:'',reservation:''};modal(id?'지출 수정':'지출 추가',field('title','사용 내역',o.title)+`<div class="gridform">${field('amount','결제 금액',o.amount,'number')}${field('currency','실제 결제 통화',o.currency,'options:CNY|KRW')}${field('payer','결제자',expenseTab==='private'?viewer:o.payer,expenseTab==='private'?'options:'+viewer:'options:유림|민지')}${field('date','결제일',o.date,'date')}</div>`+field('method','결제 수단 (트래블카드·비자·카카오페이 등)',o.method)+field('note','메모 (선택)',o.note,'textarea'),'저장','expense:'+o.id)}
function editReservation(id){let o=id?shared.reservations.find(x=>x.id===id):{id:uid(),title:'',total:'',deposit:'',currency:'CNY',payer:viewer,policy:'deduct',refund:'no',status:'예약 완료',note:''};modal(id?'예약 수정':'예약 추가',field('title','예약 항목',o.title)+`<div class="gridform">${field('total','총 예약 금액',o.total,'number')}${field('deposit','지불한 예약금',o.deposit,'number')}${field('currency','통화',o.currency,'options:CNY|KRW')}${field('payer','예약금 결제자',o.payer,'options:유림|민지')}</div>`+field('policy','예약금 처리 방식',o.policy,'options:deduct|refund|separate')+`<div class="small">deduct = 잔금 차감, refund = 환불 예정, separate = 별도 비용</div>`+field('refund','예약금 환불 완료?',o.refund,'options:no|yes')+field('status','예약 상태',o.status,'options:예약 완료|이용 완료|취소')+field('note','예약 메모',o.note,'textarea'),'저장','reservation:'+o.id)}
function placeDetail(id){let p=place(id);if(!p)return;modal(p.name,`<div class="pill" style="display:inline-block">${esc(p.category)}</div><p>${esc(p.description)}</p><div class="card"><b>먹어보고 싶은 메뉴</b><p class="muted wrap">${esc(p.order||'아직 적어둔 메뉴가 없어.')}</p><b>방문 메모</b><p class="muted wrap">${esc(p.note||'메모 없음')}</p></div><div class="card"><div class="small">고덕지도 검색어</div><p class="wrap">${esc(p.search||'미등록')}</p><div class="small">고덕지도 링크</div><p class="small wrap">${esc(p.map||'미등록')}</p>${p.map&&/^https?:\/\//.test(p.map)?`<a class="btn" href="${esc(p.map)}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">고덕지도 열기 ↗</a>`:''}</div>`,'장소 편집','detail:'+id)}
function readForm(form){let o={};for(let [k,v] of new FormData(form))o[k]=String(v);return o}
function enableClose(){closeModal()}
async function submitForm(form){const type=form.dataset.form;let data=readForm(form),[kind,id]=type.split(':');if(kind==='detail'){closeModal();editPlace(id);return}if(kind==='check'){shared.checklist.push({id:uid(),text:data.text,done:false});record('체크리스트 추가: '+data.text)}else if(kind==='event'){let arr=shared.schedules[version];let old=arr.find(x=>x.id===id);data.fixed=data.fixed==='true';let next={...data,id};if(old)Object.assign(old,next);else arr.push(next);record((old?'일정 수정':'일정 추가')+': '+data.title+' ('+ (version==='no'?'미방문':'디즈니') +')')}else if(kind==='place'){let old=place(id);if(old)Object.assign(old,data);else shared.places.push({...data,id});record((old?'장소 수정':'장소 추가')+': '+data.name)}else if(kind==='expense'){data.amount=number(data.amount);let personal=expenseTab==='private',arr=personal?privateData.expenses:shared.expenses;let old=arr.find(x=>x.id===id);if(personal)data.payer=viewer;if(old)Object.assign(old,data);else arr.push({...data,id});if(!personal)record('공동 지출 '+(old?'수정':'추가')+': '+data.title);closeModal();await persist(personal);return}else if(kind==='reservation'){let old=shared.reservations.find(x=>x.id===id);if(old)Object.assign(old,data);else shared.reservations.push({...data,id});record('예약 정보 '+(old?'수정':'추가')+': '+data.title)}closeModal();await persist()}
async function action(code){let [kind,type,id]=code.split(':');if(kind==='new'){if(type==='event')editEvent();if(type==='place')editPlace();if(type==='expense')editExpense();if(type==='reservation')editReservation();if(type==='check')modal('체크리스트 항목 추가',field('text','할 일'),'추가','check');return}if(kind==='place'){placeDetail(type);return}if(kind==='edit'){({event:editEvent,place:editPlace,expense:editExpense,reservation:editReservation}[type])(id);return}if(kind==='delete'){if(!confirm('정말 삭제할까?'))return;if(type==='expense'){let personal=expenseTab==='private',arr=personal?privateData.expenses:shared.expenses;let item=arr.find(x=>x.id===id);arr.splice(arr.findIndex(x=>x.id===id),1);if(!personal)record('공동 지출 삭제: '+item?.title);await persist(personal);return}if(type==='reservation')shared.reservations=shared.reservations.filter(x=>x.id!==id);if(type==='check')shared.checklist=shared.checklist.filter(x=>x.id!==id);record('항목 삭제');await persist();return}if(kind==='history'){modal('일정·공동 정보 변경기록',shared.history.map(h=>`<div class="listitem"><b>${esc(h.action)}</b><div class="small">${esc(h.who)} · ${new Date(h.when).toLocaleString('ko-KR')}</div></div>`).join('')||'아직 기록이 없어','닫기','readonly');return}if(kind==='rate'){modal('참고 환율',field('rate','1 CNY = KRW',shared.rate,'number'),'저장','rate');return}if(kind==='backup'){let blob=new Blob([JSON.stringify({shared,privateData,viewer},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shanghai-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(kind==='import'){$('#importFile')?.click();return}if(kind==='logout'){await fb.signOut(fb.auth);return}if(kind==='login'){showLogin();return}}
document.addEventListener('click',async ev=>{let t=ev.target.closest('[data-page],[data-day],[data-version],[data-expense-tab],[data-filter],[data-act],#closeModal,#cancelModal');if(!t)return;if(t.dataset.page)page=t.dataset.page;if(t.dataset.day)day=t.dataset.day;if(t.dataset.version)version=t.dataset.version;if(t.dataset.expenseTab)expenseTab=t.dataset.expenseTab;if(t.dataset.filter)filter=t.dataset.filter;if(t.dataset.act){await action(t.dataset.act);return}if(t.id==='closeModal'||t.id==='cancelModal'){closeModal();return}render()});document.addEventListener('change',async ev=>{let el=ev.target;if(el.dataset.check){let c=shared.checklist.find(x=>x.id===el.dataset.check);if(c)c.done=el.checked;record('체크리스트 변경: '+c?.text);await persist()}if(el.id==='viewerSelect'){saveLocal();viewer=el.value;localStorage.setItem('viewer',viewer);privateData=JSON.parse(localStorage.getItem('st_private_'+viewer)||'null')||{expenses:[]};render()}if(el.id==='importFile'){let f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.shared?.schedules||!obj.shared?.places)throw Error('올바른 백업 파일이 아니야');if(!confirm('기존 데이터를 백업 데이터로 덮어쓸까?'))return;shared=obj.shared;privateData=obj.privateData||{expenses:[]};record('백업 데이터 불러오기');await persist();await persist(true)}catch(e){alert(e.message)}}});document.addEventListener('submit',async ev=>{if(ev.target.id!=='form')return;ev.preventDefault();let f=ev.target;if(f.dataset.form==='readonly'){closeModal();return}if(f.dataset.form==='rate'){let r=number(readForm(f).rate);if(r<=0)return alert('환율은 0보다 커야 해');shared.rate=r;record('참고 환율 변경');closeModal();await persist();return}await submitForm(f)});
function showLogin(){modal('유림·민지 로그인',`<p class="small">각자 Firebase Authentication에 등록된 이메일·비밀번호로 로그인해. 계정별 이름은 운영자가 설정한 이메일과 연결돼.</p>${field('email','이메일','', 'email')}${field('password','비밀번호','','password')}`,'로그인','login')}
async function connectFirebase(){if(!firebaseConfig?.apiKey)return;try{const [appMod,authMod,fireMod]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js')]);const app=appMod.initializeApp(firebaseConfig),auth=authMod.getAuth(app);await authMod.setPersistence(auth,authMod.browserLocalPersistence);db=fireMod.getFirestore(app);fb={auth,signIn:authMod.signInWithEmailAndPassword,signOut:authMod.signOut,onAuth:authMod.onAuthStateChanged,doc:fireMod.doc,setDoc:fireMod.setDoc,onSnapshot:fireMod.onSnapshot,getDoc:fireMod.getDoc};fb.onAuth(auth,async user=>{unsub.forEach(f=>f());unsub=[];authUser=user;isCloud=!!user;authReady=true;if(user){let email=(user.email||'').toLowerCase();if(window.MEMBER_EMAILS?.yurim?.toLowerCase()===email)viewer='유림';else if(window.MEMBER_EMAILS?.minji?.toLowerCase()===email)viewer='민지';else{alert('허용된 여행 멤버 계정이 아니야.');await fb.signOut(auth);return}localStorage.setItem('viewer',viewer);const sref=fb.doc(db,'trips',TRIP,'data','main'),pref=fb.doc(db,'users',user.uid,'travel',TRIP);unsub.push(fb.onSnapshot(sref,s=>{if(s.exists()){shared=s.data();saveLocal();render()}},err=>alert('공동 데이터 읽기 실패: '+err.message)));unsub.push(fb.onSnapshot(pref,s=>{if(s.exists()){privateData=s.data();saveLocal();render()}else{privateData={expenses:[]};render()}},err=>alert('개인 가계부 읽기 실패: '+err.message)));}else{isCloud=false;render()}render()})}catch(err){authReady=true;console.error(err);alert('Firebase 연결 실패: '+err.message);render()}}
// auth 로그인 제출 처리
const originalSubmit=submitForm;submitForm=async function(f){if(f.dataset.form==='login'){let x=readForm(f);try{await fb.signIn(fb.auth,x.email,x.password);closeModal()}catch(err){alert('로그인 실패: '+err.message)}return}return originalSubmit(f)};
window.MEMBER_EMAILS=memberEmails;render();connectFirebase();
</script></body></html>
