ewer==='유림'?'selected':''}>유림</option><option ${viewer==='민지'?'selected':''}>민지</option></select></div>${firebaseConfig?btn('공동 계정 로그인','login'):'<div class="notice">실제 공동 사용은 firebase-config.js와 Firestore 보안 규칙 설정이 필요해.</div>'}`}</div><div class="card"><h3>백업·복원</h3><p class="small">현재 보이는 공유 일정 및 내 개인 가계부를 JSON으로 백업할 수 있어.</p><div class="actions">${btn('데이터 백업','backup','outline')}${btn('백업 불러오기','import','ghost')}</div><input type="file" id="importFile" accept="application/json" class="hidden"></div><div class="footer-note">Yurim & Minji · Shanghai 2026 · no pressure, just memories</div>`}
function field(k,label,value='',type='text'){return `<div class="field"><label for="f_${k}">${label}</label>${type==='textarea'?`<textarea id="f_${k}" name="${k}">${esc(value)}</textarea>`:type.startsWith('options:')?`<select id="f_${k}" name="${k}">${type.slice(8).split('|').map(o=>`<option value="${esc(o)}" ${o===String(value)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="f_${k}" name="${k}" type="${type}" value="${esc(value)}">`}</div>`}

function editExpense(id){let arr=expenseTab==='private'?privateData.expenses:shared.expenses;let o=id?arr.find(x=>x.id===id):{id:uid(),title:'',payer:viewer,amount:'',currency:'CNY',date:'2026-11-28',method:'',note:'',reservation:''};modal(id?'지출 수정':'지출 추가',field('title','사용 내역',o.title)+`<div class="gridform">${field('amount','결제 금액',o.amount,'number')}${field('currency','실제 결제 통화',o.currency,'options:CNY|KRW')}${field('payer','결제자',expenseTab==='private'?viewer:o.payer,expenseTab==='private'?'options:'+viewer:'options:유림|민지')}${field('date','결제일',o.date,'date')}</div>`+field('method','결제 수단',o.method||'알리페이','options:알리페이|위챗페이|네이버페이|카카오페이|트래블카드|비자카드|마스터카드|현금|기타')+field('note','메모 (선택)',o.note,'textarea'),'저장','expense:'+o.id)}

function editReservation(id){let o=id?shared.reservations.find(x=>x.id===id):{id:uid(),title:'',total:'',deposit:'',currency:'CNY',payer:viewer,policy:'deduct',refund:'no',status:'예약 완료',note:''};modal(id?'예약 수정':'예약 추가',field('title','예약 항목',o.title)+`<div class="gridform">${field('total','총 예약 금액',o.total,'number')}${field('deposit','지불한 예약금',o.deposit,'number')}${field('currency','통화',o.currency,'options:CNY|KRW')}${field('payer','예약금 결제자',o.payer,'options:유림|민지')}</div>`+field('policy','예약금 처리 방식',o.policy,'options:deduct|refund|separate')+`<div class="small">deduct = 잔금 차감, refund = 환불 예정, separate = 별도 비용</div>`+field('refund','예약금 환불 완료?',o.refund,'options:no|yes')+field('status','예약 상태',o.status,'options:예약 완료|이용 완료|취소')+field('note','예약 메모',o.note,'textarea'),'저장','reservation:'+o.id)}

function readForm(form){let o={};for(let [k,v] of new FormData(form))o[k]=String(v);return o}

async function submitForm(form){const type=form.dataset.form;let data=readForm(form),[kind,id]=type.split(':');if(kind==='detail'){closeModal();editPlace(id);return}if(kind==='memo'){data.title=data.title.trim();if(!data.title&&!data.content.trim())return alert('메모 내용을 입력해 줘.');const own=memoItems()[viewer];let old=own.find(x=>x.id===id);let item={id,title:data.title||'제목 없는 메모',content:data.content||'',updatedAt:new Date().toISOString()};if(old)Object.assign(old,item);else own.unshift(item);record('메모 '+(old?'수정':'추가')+': '+viewer)}else if(kind==='food'){data.name=data.name.trim();if(!data.name)return alert('음식 이름을 입력해 줘.');if(!Array.isArray(shared.foodNotes))shared.foodNotes=[];const old=shared.foodNotes.find(x=>x.id===id);const item={...data,id,author:old?.author||viewer,updatedAt:new Date().toISOString()};if(old)Object.assign(old,item);else shared.foodNotes.push(item);record('먹킷리스트 '+(old?'수정':'추가')+': '+data.name)}else if(kind==='check'){shared.checklist.push({id:uid(),text:data.text,done:false});record('체크리스트 추가: '+data.text)}else if(kind==='event'){let arr=shared.schedules[version];let old=arr.find(x=>x.id===id);data.fixed=data.fixed==='true';let next={...data,id};if(old)Object.assign(old,next);else arr.push(next);record((old?'일정 수정':'일정 추가')+': '+data.title+' ('+ (version==='no'?'미방문':'디즈니') +')')}else if(kind==='place'){let old=place(id);if(old)Object.assign(old,data);else shared.places.push({...data,id});record((old?'장소 수정':'장소 추가')+': '+data.name)}else if(kind==='expense'){data.amount=number(data.amount);let personal=expenseTab==='private',arr=personal?privateData.expenses:shared.expenses;let old=arr.find(x=>x.id===id);if(personal)data.payer=viewer;if(old)Object.assign(old,data);else arr.push({...data,id});if(!personal)record('공동 지출 '+(old?'수정':'추가')+': '+data.title);closeModal();await persist(personal);return}else if(kind==='topup'){initPrivate();let amount=Number(data.amount);if(!Number.isFinite(amount)||amount<=0)return alert('0보다 큰 금액을 입력해 줘.');data.amount=amount;data.currency=data.currency==='KRW'?'KRW':'CNY';let old=privateData.topups.find(x=>x.id===id);if(old)Object.assign(old,data);else privateData.topups.push({...data,id});closeModal();await persist(true);return}else if(kind==='reservation'){let old=shared.reservations.find(x=>x.id===id);if(old)Object.assign(old,data);else shared.reservations.push({...data,id});record('예약 정보 '+(old?'수정':'추가')+': '+data.title)}closeModal();await persist()}

  const personal=expenseTab==='private';
  if(scope==='private'&&!personal)return;
  const title=scope==='private'?'개인 가계부 전체 초기화':personal?'개인 지출 전체 초기화':'공동 지출 전체 초기화';
  const note=scope==='private'
    ?'내 개인 지출, 추가 환전·충전 내역, 시작 금액과 잔액 설정까지 전부 지워져. 공동 지출과 친구의 개인 가계부는 유지돼.'
    :personal?'내 개인 지출 기록만 전부 지워져. 시작 금액·추가 환전 내역 및 공동 지출은 그대로 남아.'
             :'유림과 민지가 함께 기록한 공동 지출 내역이 전부 지워져. 개인 가계부와 예약 목록은 그대로 유지돼. 두 사람 모두에게 적용돼.';
  const count=scope==='private'?(privateData.expenses||[]).length+(privateData.topups||[]).length:personal?(privateData.expenses||[]).length:(shared.expenses||[]).length;
  modal(title,`<div class="reset-note"><b>주의: 삭제한 기록은 앱에서 되돌릴 수 없어.</b><br>${note}<br>삭제 대상 기록: ${count}건<br>필요하다면 먼저 더보기 → 데이터 백업을 이용해 줘.</div><div class="field"><label>진행하려면 아래에 <b>초기화</b>라고 입력해 줘.</label><input name="confirmation" class="reset-confirm" placeholder="초기화" autocomplete="off" required></div>`, '초기화 실행', 'reset:'+scope+(personal?':private':':shared'));
}
async function resetMoney(scope,ledger){
  const personal=ledger==='private';
  if(scope==='private'&&!personal)return;
  if(scope==='private'){
    privateData.expenses=[];privateData.topups=[];privateData.openingBalance=0;
    privateData.budgetConfigured=false;privateData.noOpening=true;
    await persist(true);
  }else if(personal){privateData.expenses=[];await persist(true)}
  else{shared.expenses=[];record('공동 지출 전체 초기화');await persist(false)}
}
async function action(code){if(code==='defaultSchedule'){if(version===shared.defaultVersion)return;shared.defaultVersion=version;record('기본 일정 변경: '+(version==='yes'?'디즈니 방문':'디즈니 미방문'));await persist();return}let [kind,type,id]=code.split(':');if(kind==='reset'){showResetConfirm(type);return}if(kind==='new'){if(type==='event')editEvent();if(type==='place')editPlace();if(type==='expense')editExpense();if(type==='reservation')editReservation();if(type==='topup')editTopup();if(type==='food')editFoodNote();if(type==='memo')editMemo();if(type==='check')modal('체크리스트 항목 추가',field('text','할 일'),'추가','check');return}if(kind==='place'){placeDetail(type);return}if(kind==='edit'){({event:editEvent,place:editPlace,food:editFoodNote,memo:editMemo,expense:editExpense,reservation:editReservation,topup:editTopup}[type])(id);return}if(kind==='delete'){if(type==='expense'){let personal=expenseTab==='private',arr=personal?privateData.expenses:shared.expenses;let item=arr.find(x=>x.id===id);if(!item)return alert('삭제할 내역을 찾지 못했어.');if(!confirm(`「${item.title}」 지출 내역을 삭제할까?\n삭제하면 가계부 합계와 잔액도 다시 계산돼.`))return;arr.splice(arr.findIndex(x=>x.id===id),1);if(!personal)record('공동 지출 삭제: '+item.title);await persist(personal);return}if(type==='memo'){let own=memoItems()[viewer];const item=own.find(x=>x.id===id);if(!item)return alert('본인의 메모만 삭제할 수 있어.');if(!confirm(`「${item.title}」 메모를 삭제할까?`))return;shared.memoBoards[viewer]=own.filter(x=>x.id!==id);record('메모 삭제: '+viewer);await persist();return}if(type==='food'){const item=(shared.foodNotes||[]).find(x=>x.id===id);if(!item)return;if(!confirm(`「${item.name}」을(를) 목록에서 삭제할까?`))return;shared.foodNotes=shared.foodNotes.filter(x=>x.id!==id);record('먹킷리스트 삭제: '+item.name);await persist();return}if(!confirm('정말 삭제할까?'))return;if(type==='topup'){initPrivate();privateData.topups=privateData.topups.filter(x=>x.id!==id);await persist(true);return}if(type==='reservation')shared.reservations=shared.reservations.filter(x=>x.id!==id);if(type==='check')shared.checklist=shared.checklist.filter(x=>x.id!==id);record('항목 삭제');await persist();return}if(kind==='history'){modal('일정·공동 정보 변경기록',shared.history.map(h=>`<div class="listitem"><b>${esc(h.action)}</b><div class="small">${esc(h.who)} · ${new Date(h.when).toLocaleString('ko-KR')}</div></div>`).join('')||'아직 기록이 없어','닫기','readonly');return}if(kind==='rate'){modal('기준 환율 직접 설정',`<p class="small">자동 조회가 실패했을 때 사용할 임시 기준 환율이야. 자동 조회가 성공하면 자동 환율이 우선 적용돼.</p>`+field('rate','1 CNY = KRW',shared.rate,'number'),'저장','rate');return}if(kind==='fxrefresh'){await refreshFx();return}if(kind==='budget'){initPrivate();modal(budgetMode()==='balance'?'시작 금액 수정':'시작 금액 설정',`<p class="small">최초 한 번만 입력하고, 나중에 필요할 때 수정할 수 있어. 개인·공동 지출을 빼서 잔액을 계산해.</p>`+field('openingBalance','준비한 시작 금액',privateData.openingBalance??0,'number')+field('balanceCurrency','잔액 기준 통화',privateData.balanceCurrency||'CNY','options:CNY|KRW'),'저장','budget');return}if(kind==='backup'){let blob=new Blob([JSON.stringify({shared,privateData,viewer},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='shanghai-trip-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(kind==='import'){$('#importFile')?.click();return}if(kind==='logout'){await fb.signOut(fb.auth);return}if(kind==='login'){showLogin();return}}
document.addEventListener('click',async ev=>{if(ev.target.closest('#weatherRefresh')){await refreshWeather();return}let t=ev.target.closest('[data-page],[data-day],[data-version],[data-expense-tab],[data-filter],[data-act],#closeModal,#cancelModal');if(!t)return;if(t.dataset.page)page=t.dataset.page;if(t.dataset.day)day=t.dataset.day;if(t.dataset.version)version=t.dataset.version;if(t.dataset.expenseTab)expenseTab=t.dataset.expenseTab;if(t.dataset.filter)filter=t.dataset.filter;if(t.dataset.act){await action(t.dataset.act);return}if(t.id==='closeModal'||t.id==='cancelModal'){closeModal();return}render()});document.addEventListener('change',async ev=>{let el=ev.target;if(el.id==='f_category'){updatePlaceCategoryUI();return}if(el.id==='noOpening'){initPrivate();privateData.noOpening=el.checked;await persist(true);return}if(el.dataset.check){let c=shared.checklist.find(x=>x.id===el.dataset.check);if(c)c.done=el.checked;record('체크리스트 변경: '+c?.text);await persist()}if(el.id==='viewerSelect'){saveLocal();viewer=el.value;localStorage.setItem('viewer',viewer);privateData=JSON.parse(localStorage.getItem('st_private_'+viewer)||'null')||{expenses:[]};render()}if(el.id==='importFile'){let f=el.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.shared?.schedules||!obj.shared?.places)throw Error('올바른 백업 파일이 아니야');if(!confirm('기존 데이터를 백업 데이터로 덮어쓸까?'))return;shared=obj.shared;privateData=obj.privateData||{expenses:[]};record('백업 데이터 불러오기');await persist();await persist(true)}catch(e){alert(e.message)}}});document.addEventListener('submit',async ev=>{if(ev.target.id!=='form')return;ev.preventDefault();let f=ev.target;if(f.dataset.form==='readonly'){closeModal();return}if(f.dataset.form.startsWith('reset:')){let d=readForm(f);if(d.confirmation?.trim()!=='초기화'){alert('확인란에 초기화라고 정확히 입력해 줘.');return}let [,scope,ledger]=f.dataset.form.split(':');if(!confirm('마지막 확인: 선택한 가계부의 기록을 정말 초기화할까? 이 작업은 되돌릴 수 없어.'))return;closeModal();await resetMoney(scope,ledger);return}if(f.dataset.form==='budget'){let d=readForm(f);if(!Number.isFinite(Number(d.openingBalance))||Number(d.openingBalance)<0)return alert('0 이상의 금액을 입력해줘');privateData.openingBalance=Number(d.openingBalance);privateData.balanceCurrency=d.balanceCurrency==='KRW'?'KRW':'CNY';privateData.budgetConfigured=true;privateData.noOpening=false;initPrivate();closeModal();await persist(true);return}if(f.dataset.form==='rate'){let r=number(readForm(f).rate);if(r<=0)return alert('환율은 0보다 커야 해');shared.rate=r;record('참고 환율 변경');closeModal();await persist();return}await submitForm(f)});
function showLogin(){modal('유림·민지 로그인',`<p class="small">각자 Firebase Authentication에 등록된 이메일·비밀번호로 로그인해. 계정별 이름은 운영자가 설정한 이메일과 연결돼.</p>${field('email','이메일','', 'email')}${field('password','비밀번호','','password')}`,'로그인','login')}
async function connectFirebase(){if(!firebaseConfig?.apiKey)return;try{const [appMod,authMod,fireMod]=await Promise.all([import('https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js')]);const app=appMod.initializeApp(firebaseConfig),auth=authMod.getAuth(app);await authMod.setPersistence(auth,authMod.browserLocalPersistence);db=fireMod.getFirestore(app);fb={auth,signIn:authMod.signInWithEmailAndPassword,signOut:authMod.signOut,onAuth:authMod.onAuthStateChanged,doc:fireMod.doc,setDoc:fireMod.setDoc,onSnapshot:fireMod.onSnapshot,getDoc:fireMod.getDoc};fb.onAuth(auth,async user=>{unsub.forEach(f=>f());unsub=[];defaultApplied=false;authUser=user;isCloud=!!user;authReady=true;if(user){let email=(user.email||'').toLowerCase();if(window.MEMBER_EMAILS?.yurim?.toLowerCase()===email)viewer='유림';else if(window.MEMBER_EMAILS?.minji?.toLowerCase()===email)viewer='민지';else{alert('허용된 여행 멤버 계정이 아니야.');await fb.signOut(auth);return}localStorage.setItem('viewer',viewer);const sref=fb.doc(db,'trips',TRIP,'data','main'),pref=fb.doc(db,'users',user.uid,'travel',TRIP);unsub.push(fb.onSnapshot(sref,s=>{if(s.exists()){shared=s.data();const favoriteUpgrade=applyFavoritePlaces(shared);if(favoriteUpgrade){writeQueue=writeQueue.then(()=>fb.setDoc(sref,shared)).catch(err=>console.error('장소 보관함 초기 등록 실패:',err));}if(!['yes','no'].includes(shared.defaultVersion))shared.defaultVersion='yes';if(!defaultApplied){version=shared.defaultVersion;defaultApplied=true}saveLocal();render()}else{applyFavoritePlaces(shared);writeQueue=writeQueue.then(()=>fb.setDoc(sref,shared)).catch(err=>console.error('공동 여행 초기 데이터 저장 실패:',err));render()}},err=>alert('공동 데이터 읽기 실패: '+err.message)));unsub.push(fb.onSnapshot(pref,s=>{if(s.exists()){privateData=s.data();saveLocal();render()}else{privateData={expenses:[],openingBalance:0,balanceCurrency:viewer==='민지'?'KRW':'CNY',topups:[],budgetConfigured:false,noOpening:false};render()}},err=>alert('개인 가계부 읽기 실패: '+err.message)));}else{isCloud=false;render()}render()})}catch(err){authReady=true;console.error(err);alert('Firebase 연결 실패: '+err.message);render()}}
// auth 로그인 제출 처리
const originalSubmit=submitForm;submitForm=async function(f){if(f.dataset.form==='login'){let x=readForm(f);try{await fb.signIn(fb.auth,x.email,x.password);closeModal()}catch(err){alert('로그인 실패: '+err.message)}return}return originalSubmit(f)};
window.MEMBER_EMAILS=memberEmails;render();renderWeather();connectFirebase();refreshFx();refreshWeather();setInterval(refreshWeather,15*60*1000);
